name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-kaggle-browser-suite
  cancel-in-progress: false

jobs:
  test:
    name: Real Kaggle browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Hackatime
        uses: actions/checkout@v7
        with:
          repository: hackclub/hackatime
          ref: a655b2e0a81364eef342640b4d37f76e03931d5e
          path: .hackatime
      - name: Set up Ruby for Hackatime
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: .hackatime
      - name: Prepare local Hackatime
        working-directory: .hackatime
        run: bin/rails db:schema:load db:seed
      - name: Start local Hackatime
        working-directory: .hackatime
        shell: bash
        run: |
          set -euo pipefail
          nohup bin/rails server -b 127.0.0.1 -p 3100 >"$RUNNER_TEMP/hackatime.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --output /dev/null http://localhost:3100/up; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hackatime.log"
          exit 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx --bun playwright install --with-deps chromium
      - name: Test real Kaggle against local Hackatime
        env:
          KAGGLE: ${{ secrets.KAGGLE }}
          HACKATIME_TEST_URL: http://localhost:3100
          HACKATIME_TEST_API_KEY: dev-api-key-12345
        run: bun run test
      - run: bun run typecheck
      - run: bun run check:manifest

      - name: Upload Hackatime log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hackatime-log-${{ github.run_id }}
          path: ${{ runner.temp }}/hackatime.log
          if-no-files-found: ignore

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(bun -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION" >&2
            exit 1
          fi
          MANIFEST_VERSION=$(bun -p 'require("./.output/chrome-mv3/manifest.json").version')
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "Built manifest version $MANIFEST_VERSION does not match package version $VERSION" >&2
            exit 1
          fi

      - name: Package ZIP and CRX
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(bun -p 'require("./package.json").version')
          bun run zip
          mkdir -p release
          ZIP_PATH=$(find .output -maxdepth 1 -type f -name '*-chrome.zip' -print -quit)
          test -n "$ZIP_PATH"
          cp "$ZIP_PATH" "release/kaggle-notebooks-wakatime-$VERSION-chrome.zip"
          python3 - "release/kaggle-notebooks-wakatime-$VERSION-store-assets.zip" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          files = [
              Path("PRIVACY.md"),
              Path("store-assets/CWS_SUBMISSION.md"),
              Path("store-assets/icon-128.png"),
              Path("store-assets/screenshot-working-1280x800.png"),
              Path("store-assets/screenshot-settings-1280x800.png"),
              Path("store-assets/screenshot-kaggle-1280x800.png"),
              Path("store-assets/small-promo-440x280.png"),
          ]
          with ZipFile(sys.argv[1], "w", ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.name)
          PY

          CHROMIUM_PATH=$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')
          KEY_ARGS=()
          if [[ -n "${CRX_PRIVATE_KEY:-}" ]]; then
            KEY_PATH="$RUNNER_TEMP/kaggle-wakatime.pem"
            printf '%s' "$CRX_PRIVATE_KEY" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            KEY_ARGS+=("--pack-extension-key=$KEY_PATH")
          fi
          "$CHROMIUM_PATH" \
            --headless=new \
            --no-sandbox \
            --pack-extension="$GITHUB_WORKSPACE/.output/chrome-mv3" \
            "${KEY_ARGS[@]}"
          mv .output/chrome-mv3.crx "release/kaggle-notebooks-wakatime-$VERSION-chrome.crx"
          rm -f .output/chrome-mv3.pem
          (cd release && sha256sum *.zip *.crx > SHA256SUMS.txt)

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "Hackatime for Kaggle Notebooks $GITHUB_REF_NAME"
          fi
